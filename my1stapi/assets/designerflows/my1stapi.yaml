$integration: http://ibm.com/appconnect/integration/v2/integrationFile
integration:
  type: api
  trigger-interfaces:
    trigger-interface-1:
      triggers:
        createMy1stmodel:
          assembly:
            $ref: '#/integration/assemblies/assembly-1'
          input-context:
            data: createMy1stmodel
          output-context:
            data: createMy1stmodel
      options:
        resources:
          - business-object: my1stmodel
            triggers:
              create: createMy1stmodel
            model:
              $ref: '#/models/my1stmodel'
      type: api-trigger
  action-interfaces:
    action-interface-1:
      type: api-action
      business-object: message
      connector-type: mq
      account-name: my-1st-ms
      actions:
        PUTMESSAGE: {}
      options:
        connectorServiceOptions:
          httpMethod: post
          path: resources/message/operations/PUTMESSAGE
          action: custom
  assemblies:
    assembly-1:
      assembly:
        execute:
          - custom-action:
              name: IBM MQ Put message on a queue
              target:
                $ref: '#/integration/action-interfaces/action-interface-1'
              action: PUTMESSAGE
              map:
                mappings:
                  - message:
                      template: '{{$Request.message}}'
                  - messageType:
                      template: TEXT
                  - queueName:
                      template: my1stqueue
                $map: http://ibm.com/appconnect/map/v1
                input:
                  - variable: flowDetails
                    $ref: '#/flowDetails'
                  - variable: Request
                    $ref: '#/trigger/payload'
              filter: {}
          - response:
              name: response
              reply-maps:
                - title: my1stmodel successfully created
                  status-code: 201
                  map:
                    $map: http://ibm.com/appconnect/map/v1
                    input:
                      - variable: IBMMQPutmessageonaqueue
                        $ref: >-
                          #/node-output/IBM MQ Put message on a
                          queue/response/payload
                      - variable: flowDetails
                        $ref: '#/flowDetails'
                      - variable: Request
                        $ref: '#/trigger/payload'
                    mappings:
                      - message:
                          template: '{{$Request.message}}'
                      - name:
                          template: '{{$Request.name}}'
                      - response:
                          template: >-
                            Thanks for using our API, {{$Request.name}}. We put
                            your message onto the my1stqueue queue. Contents
                            were: {{$Request.message}}
  name: my1stapi
models:
  my1stmodel:
    name: my1stmodel
    plural: my1stmodel
    properties:
      name:
        required: false
        id: true
        type: string
      message:
        required: false
        id: false
        type: string
      response:
        required: false
        id: false
        type: string
    operations:
      create: '#/integration/assemblies/assembly-1'
    description: ''
x-ibm-configuration:
  gateway: datapower-api-gateway
  type: rest
  phase: realized
  enforced: true
  testable: true
  cors:
    enabled: true
  assembly:
    execute:
      - invoke:
          title: Invoke flow
          version: 2.0.0
          verb: keep
          target-url: $(app-connect-designer-url)$(request.path)
          follow-redirects: false
          timeout: 60
          parameter-control:
            type: blocklist
          header-control:
            type: blocklist
          inject-proxy-headers: true
          username: $(app-connect-designer-username)
          password: $(app-connect-designer-password)
